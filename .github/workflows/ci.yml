name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run for the same ref pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The release line that holds the engines floor (22.18), and current LTS.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Chromium is a large download, so key the cache on the Playwright
      # version that pins the revision rather than on the lockfile as a whole.
      # Read it from the lockfile: package.json only holds a range, which stays
      # the same when an update moves Playwright (and its Chromium) forward.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `prepare` builds on install, so dist/ is ready for the tests.
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the shared libraries it links.
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The Claude plugin runs src/index.ts directly with Node's type stripping.
      - name: Start from source
        run: node src/index.ts --version

      - name: Agent loop tests
        run: npm run test:agent

      - name: End-to-end tests
        run: npm run test:e2e
